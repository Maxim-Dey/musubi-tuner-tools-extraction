# Веса модели. Замените эти абсолютные пути на файлы на сервере обучения.
# Версия Comfy-Org/Krea-2 BF16 Raw имеет тот же хеш SHA-256, что и официальный файл raw.safetensors.
vae = "/workspace/models/Qwen-Image/split_files/vae/qwen_image_vae.safetensors"
text_encoder = "/workspace/models/Qwen3-VL/text_encoders/qwen3vl_4b_bf16.safetensors"
tokenizer_path = "/workspace/models/Qwen3-VL-4B-Instruct"
# Public identical Raw distribution: Comfy-Org/Krea-2@1171f4dc7e325bf3734586942e737872506c73e1.
# Verified full SHA-256: f99bb0ff8e362b77342bc4994e0c50906fe7ef7074864b181b7d48d2fa6d03d7.
dit = "/workspace/models/Krea-2/diffusion_models/krea2_raw_bf16.safetensors"

# Only sample generation uses Turbo with the current LoRA; train/val stay Raw.
# Model transfer/integrity and GPU readiness are verified separately.
turbo_dit = "/workspace/models/Krea-2/diffusion_models/krea2_turbo_bf16.safetensors"
turbo_dit_cache = true


# Относительные пути считаются от этого файла; пути датасетов — от их собственных TOML.
experiment_mode = true
# Подготовить отсутствующие train/val кэши перед загрузкой модели обучения.
auto_cache = true

# Каталог вывода
output_dir = "output"
output_name = "krea2_raw_lora"

# Каталог логов
log_prefix = "krea2_raw_lora"
log_with = "tensorboard"
logging_dir = "output/tensorboard"

# LoRA
network_module = "networks.lora_krea2"
network_dim = 32
network_alpha = 32
network_dropout = 0.05

# Оптимизатор и расписание
max_train_steps = 1000
gradient_accumulation_steps = 2
seed = 42
optimizer_type = "AdamW8bit"
learning_rate = 1e-4
lr_scheduler = "constant_with_warmup"
lr_warmup_steps = 100
max_grad_norm = 1.0

# Чекпоинты. Единственный возобновляемый адаптер должен оставаться FP32. BF16 округлит единственную копию.
save_precision = "fp32"
save_every_n_steps = 50
save_last_n_steps = 1000
save_state = true

# Resume: папка полного checkpoint (веса + состояние optimizer); путь от train.toml.
# max_train_steps — общий итог шагов, не число дополнительных.
# Настройки должны соответствовать сохранённому checkpoint.
# resume = "output/krea2_raw_lora-step000200"

# Валидация
val_every_n_steps = 50
val_seed_noise = 42
val_level_noise_n = 10
val_seed_noise_n = 2

# Примерные изображения
sample_prompts = "sample_prompts.txt"
sample_every_n_steps = 200
sample_at_first = false

# Датасеты
dataset_config = "train-dataset.toml"
val_dataset_config = "val-dataset.toml"

# Точность и память
mixed_precision = "bf16"
fp8_base = false
fp8_scaled = false
# ConvRot INT8 is a separate alternative to the paired scaled-FP8 flags.
convrot_int8 = false
convrot_int8_bwd = "bf16"
blocks_to_swap = 0
sdpa = true
gradient_checkpointing = true

# Таймстепы и loss. shift задаёт таймстепы обучения; фиксированные уровни валидации его не используют.
timestep_sampling = "krea2_shift"
sigmoid_scale = 1.0
# Если обучать только на выбранном участке исходного распределения, необходимо поставить true
preserve_distribution_shape = false
min_timestep = 0
max_timestep = 1000
weighting_scheme = "none"

# Загрузчик данных
max_data_loader_n_workers = 2
persistent_data_loader_workers = false
