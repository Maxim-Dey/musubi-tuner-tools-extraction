# Веса модели. Замените эти три абсолютных пути на файлы на сервере обучения.
# Используйте оригинальный BF16 Qwen-Image DiT, а не предконвертированный FP8 чекпоинт.
dit = "/workspace/models/qwen_image_2512_bf16.safetensors"
vae = "/workspace/models/qwen_image_vae.safetensors"
text_encoder = "/workspace/models/qwen_2.5_vl_7b.safetensors"
# resume = "<путь к папке с сохранённым состоянием обучения для возобновления>"
model_version = "original"

# Относительные пути считаются от этого файла; пути датасетов — от их собственных TOML.
experiment_mode = true
# Подготовить отсутствующие train/val кэши перед загрузкой модели обучения.
auto_cache = true

# Каталог вывода
output_dir = "output"
output_name = "qwen_image_lora_val_example"

# Каталог логов
log_prefix = "qwen_image_lora_val_example"
log_with = "tensorboard"
logging_dir = "output/tensorboard"

# LoRA
network_module = "networks.lora_qwen_image"
network_dim = 32
network_alpha = 32
network_dropout = 0.05

# Оптимизатор и расписание
max_train_steps = 5000
gradient_accumulation_steps = 1
seed = 42
optimizer_type = "adamw8bit"
learning_rate = 1e-4
lr_scheduler = "constant_with_warmup"
lr_warmup_steps = 100
max_grad_norm = 1.0

# Чекпоинты. Единственный возобновляемый адаптер должен оставаться FP32. BF16 округлит единственную копию.
save_precision = "fp32"
save_every_n_steps = 50
save_last_n_steps = 1000
save_state = true

# Валидация
val_every_n_steps = 50
val_seed_noise = 42
val_level_noise_n = 10
val_seed_noise_n = 2

# Примерные изображения
sample_prompts = "sample_prompts.txt"
sample_every_n_steps = 50
sample_at_first = false

# Датасеты
dataset_config = "train-dataset.toml"
val_dataset_config = "val-dataset.toml"

# Точность и память
mixed_precision = "bf16"
fp8_base = false
fp8_scaled = false
fp8_vl = false
blocks_to_swap = 0
sdpa = true
gradient_checkpointing = true

# Таймстепы и loss. shift задаёт таймстепы обучения; фиксированные уровни валидации его не используют.
timestep_sampling = "shift"
discrete_flow_shift = 2.2
min_timestep = 0
max_timestep = 1000
preserve_distribution_shape = true
weighting_scheme = "none"

# Загрузчик данных
max_data_loader_n_workers = 2
persistent_data_loader_workers = true