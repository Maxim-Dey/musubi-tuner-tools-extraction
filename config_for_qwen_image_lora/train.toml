# Qwen-Image (original), LoRA, NVIDIA H200.
# Все относительные пути считаются от корня репозитория.

# === Модель и веса ===
# ЗАМЕНИТЬ пути. Исходный DiT должен быть BF16, не готовый FP8.
model_version = "original"
dit = "D:/AI/models/qwen_image_bf16.safetensors"
vae = "D:/AI/models/qwen_image_vae.safetensors"
text_encoder = "D:/AI/models/qwen_2.5_vl_7b.safetensors"

# === Датасет и загрузка данных ===
dataset_config = "config_for_qwen_image_lora/dataset.toml"
# 0 упрощает запуск загрузчика данных на Windows.
max_data_loader_n_workers = 0
persistent_data_loader_workers = false

# === Архитектура LoRA ===
network_module = "networks.lora_qwen_image"
network_dim = 16
network_alpha = 16

# === Точность и память ===
# H200: BF16-веса без FP8-квантования и переноса блоков в RAM.
mixed_precision = "bf16"
fp8_base = false
fp8_scaled = false
fp8_vl = false
blocks_to_swap = 0
sdpa = true
gradient_checkpointing = true

# === Длительность и накопление градиентов ===
# Шаг — обновление оптимизатора.
max_train_steps = 1600
gradient_accumulation_steps = 1
seed = 42

# === Оптимизатор и скорость обучения ===
optimizer_type = "adamw8bit"
learning_rate = 5e-5
lr_scheduler = "constant_with_warmup"
lr_warmup_steps = 200
max_grad_norm = 1.0

# === Выбор временных шагов диффузии и взвешивание loss ===
timestep_sampling = "shift"
discrete_flow_shift = 2.2
weighting_scheme = "none"

# === Сохранение LoRA и продолжение обучения ===
output_dir = "qwen_image_lora/output"
output_name = "qwen_image_lora"
save_precision = "bf16"
save_every_n_steps = 200
# Хранить чекпоинты LoRA за последние 1000 шагов, включая границу диапазона.
# Более старые удаляются при очередном сохранении.
save_last_n_steps = 1000
# Состояние оптимизатора нужно для продолжения обучения и занимает место.
save_state = true
# Отдельный диапазон хранения состояний для продолжения обучения.
save_last_n_steps_state = 1000
# Чтобы хранить всё, закомментируйте оба параметра save_last_n_steps*.
# Для продолжения добавьте resume = "путь/к/state".

# === Логирование ===
logging_dir = "qwen_image_lora/logs"
log_with = "tensorboard"

# === Контрольные изображения ===
# Замените TOK в sample_prompts.txt своим триггером.
# Чтобы отключить сэмплы, закомментируйте три параметра ниже.
sample_prompts = "config_for_qwen_image_lora/sample_prompts.txt"
sample_every_n_steps = 200
sample_at_first = false
