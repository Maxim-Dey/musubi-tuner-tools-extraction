# Model weights. Replace these three absolute paths with files on the training server.
# Use the original BF16 Qwen-Image DiT, not a preconverted FP8 checkpoint.
dit = "/models/qwen_image_2512_bf16.safetensors"
vae = "/models/qwen_image_vae.safetensors"
text_encoder = "/models/qwen_2.5_vl_7b.safetensors"
model_version = "original"

# Output directory
output_dir = "output"
output_name = "qwen_image_lora_val_example"

# Logs directory
log_prefix = "qwen_image_lora_val_example"
log_with = "tensorboard"
logging_dir = "output/tensorboard"

# LoRA
network_module = "networks.lora_qwen_image"
network_dim = 32
network_alpha = 32
network_dropout = 0.05

# Optimizer and schedule
max_train_steps = 5000
gradient_accumulation_steps = 1
seed = 42
optimizer_type = "adamw8bit"
learning_rate = 1e-4
lr_scheduler = "constant_with_warmup"
lr_warmup_steps = 100
max_grad_norm = 1.0

# Checkpoints. The single resumable adapter must remain FP32. BF16 would round its only copy.
save_precision = "fp32"
save_every_n_steps = 50
save_last_n_steps = 1000
save_state = true

# Validation
val_every_n_steps = 50
val_seed_noise = 42
val_level_noise_n = 10
val_seed_noise_n = 2

# Sample images
sample_prompts = "sample_prompts.txt"
sample_every_n_steps = 50
sample_at_first = false

# Experiment and datasets
experiment_dir = "."
dataset_config = "train-dataset.toml"
val_dataset_config = "val-dataset.toml"

# Precision and memory
mixed_precision = "bf16"
fp8_base = false
fp8_scaled = false
fp8_vl = false
blocks_to_swap = 0
sdpa = true
gradient_checkpointing = true

# Timesteps and loss. The shift controls training timesteps; fixed validation levels do not use it.
timestep_sampling = "shift"
discrete_flow_shift = 2.2
weighting_scheme = "none"

# Data loader
max_data_loader_n_workers = 2
persistent_data_loader_workers = true